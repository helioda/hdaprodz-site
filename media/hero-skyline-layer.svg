<defs>
<linearGradient id="rib" x1="0" x2="1"><stop offset="0" stop-color="#7a5cff" stop-opacity="0"/><stop offset=".25" stop-color="#7a5cff"/><stop offset=".6" stop-color="#d08bff"/><stop offset="1" stop-color="#ffb27a"/></linearGradient>
<linearGradient id="rib2" x1="0" x2="1"><stop offset="0" stop-color="#ffb27a" stop-opacity="0"/><stop offset=".3" stop-color="#ffb27a"/><stop offset=".6" stop-color="#c98bff"/><stop offset="1" stop-color="#7fe3ff"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#eef4ff" stop-opacity=".4"/><stop offset=".56" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
 <animateTransform attributeName="gradientTransform" type="translate" values="-1 -1;1 1;1 1" keyTimes="0;.55;1" dur="8s" repeatCount="indefinite"/></linearGradient>
<filter id="blur" x="-10%" y="-80%" width="120%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<style>
.glow{fill:none;stroke-width:22;opacity:.32;filter:url(#blur)}
.core{fill:none;stroke-width:2.6;stroke-linecap:round;opacity:.9}
.flow{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-dasharray:2 52;opacity:.8;animation:flow 7s linear infinite}
.edge{fill:none;stroke:#d7ccff;stroke-width:1.4;stroke-opacity:.5;stroke-dasharray:4 6;animation:dash 14s linear infinite}
.ring{fill:none;stroke:#ffb98a;stroke-width:2.2;transform-box:fill-box;transform-origin:center;animation:ping 3.4s ease-out infinite}
.dot{fill:#fff}
@keyframes flow{to{stroke-dashoffset:-540}}
@keyframes dash{to{stroke-dashoffset:-200}}
@keyframes ping{0%{transform:scale(.6);opacity:.9}80%,100%{transform:scale(2.8);opacity:0}}
</style>
