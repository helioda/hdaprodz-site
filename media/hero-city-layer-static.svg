<defs>
<linearGradient id="rib" x1="0" x2="1"><stop offset="0" stop-color="#7a5cff" stop-opacity="0"/><stop offset=".35" stop-color="#8f6bff"/><stop offset=".7" stop-color="#d08bff"/><stop offset="1" stop-color="#ffb27a"/></linearGradient>
<linearGradient id="rib2" x1="0" x2="1"><stop offset="0" stop-color="#ffb27a" stop-opacity="0"/><stop offset=".4" stop-color="#ffb27a"/><stop offset=".7" stop-color="#c98bff"/><stop offset="1" stop-color="#7fe3ff"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#f3eaff" stop-opacity=".45"/><stop offset=".56" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
 </linearGradient>
<filter id="blur" x="-10%" y="-80%" width="120%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
<filter id="neon" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.glow{fill:none;stroke-width:16;opacity:.3;filter:url(#blur)}
.core{fill:none;stroke-width:2;stroke-linecap:round;opacity:.85}
.flow{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:2 44;opacity:.8;}
.edge{fill:none;stroke:#e2d9ff;stroke-width:1.2;stroke-opacity:.55;stroke-dasharray:4 5;}
.outline{fill:none;stroke:#c9f4ff;stroke-width:1.6;stroke-opacity:.85;filter:url(#neon)}
.ring{fill:none;stroke:#ffb98a;stroke-width:1.8;transform-box:fill-box;transform-origin:center;opacity:.6}
.dot{fill:#fff}
@keyframes flow{to{stroke-dashoffset:-460}}
@keyframes dash{to{stroke-dashoffset:-180}}
@keyframes ping{0%{transform:scale(.6);opacity:.9}80%,100%{transform:scale(2.8);opacity:0}}
</style>
